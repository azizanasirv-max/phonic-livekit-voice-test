# Create or deploy the Deepslate Opal LiveKit Cloud agent.
#
# The previous agent was DELETED. The first run must therefore be
# `operation: create` with `confirm_create: true`. Create registers a new agent,
# deploys it, and writes the new `livekit.toml`. The workflow then uploads that
# file as an artifact and commits it back to this branch, so every later run can
# use `operation: deploy` and update the SAME agent instead of creating another.
#
# There is NO automatic fallback between create and deploy:
#   * deploy fails if `livekit.toml` is missing or has no CA_... agent id;
#   * create fails if `livekit.toml` already exists or confirm_create is false.
#     (The official action would otherwise exit successfully without creating
#     anything when the file exists, or create a duplicate after a lost file.)
#
# MANUAL ONLY: workflow_dispatch has no push/PR trigger. Nothing reaches
# LiveKit Cloud unless a human starts a run from the Actions tab.
#
# TTS: this deployment uses ElevenLabs server-side TTS. Deepslate does not
# provide a hosted voice id, and the plugin's only TTS backends are
# `eleven_labs` and Deepslate-hosted (`hosted`). ELEVENLABS_API_KEY and
# ELEVENLABS_VOICE_ID are therefore required. DEEPSLATE_HOSTED_VOICE_ID is
# still accepted if it is ever added, but it is NOT required.
#
# NATIVE OPAL STS STATUS (2026-10-19): NOT AVAILABLE in Deepslate Realtime API
# 0.1.23. With tts_configuration omitted the server returns text only, and the
# plugin derives audioOutput from ttsConfig. This workflow therefore still
# configures a TTS backend. Do not describe this deployment as native
# speech-to-speech. See README "Native Opal STS status" and run
# `npm run probe:native-sts` against your account to verify.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   Required:
#     LIVEKIT_URL, LIVEKIT_API_KEY, LIVEKIT_API_SECRET
#     DEEPSLATE_VENDOR_ID, DEEPSLATE_ORGANIZATION_ID, DEEPSLATE_API_KEY
#     ELEVENLABS_API_KEY, ELEVENLABS_VOICE_ID
#   Optional:
#     DEEPSLATE_MODEL, DEEPSLATE_VAD_START_MS, DEEPSLATE_VAD_STOP_MS,
#     DEEPSLATE_VAD_CONFIDENCE, DEEPSLATE_VAD_MIN_VOLUME,
#     DEEPSLATE_VAD_BACKBUFFER_MS, ELEVENLABS_MODEL_ID, LIVEKIT_AGENT_NAME,
#     DEEPSLATE_HOSTED_VOICE_ID (alternative to the ElevenLabs pair)
#   Legacy/optional:
#     SECRET_LIST - not needed; if present, its KEY=VALUE pairs are migrated
#     and obsolete PHONIC_* entries are dropped. Individual secrets win.
#
# No secret value is printed. Every value placed in the deploy-action
# SECRET_LIST input is registered with ::add-mask:: first.
name: Create or Deploy LiveKit Cloud Agent

on:
  workflow_dispatch:
    inputs:
      operation:
        description: >-
          "create" registers a NEW LiveKit Cloud agent (first run only) and
          writes livekit.toml. "deploy" ships a new version of the agent named
          in the committed livekit.toml. There is no automatic fallback.
        required: true
        type: choice
        options:
          - deploy
          - create
        default: deploy
      confirm_create:
        description: >-
          Safety confirmation for operation=create. Must be true, and
          livekit.toml must be absent, or the run stops before creating.
        required: false
        type: boolean
        default: false
      region:
        description: >-
          Optional LiveKit Cloud region (for example "us-east"). Leave empty
          for the region the agent already uses / the nearest region.
        required: false
        type: string
        default: ""
      room_smoke_test:
        description: >-
          After the agent is healthy, join a temporary LiveKit room with a
          subscribe-only participant and verify that the deployed agent joins.
        required: false
        type: boolean
        default: true

# One fixed group, so two runs against the same LiveKit Cloud agent can never
# race. cancel-in-progress is false: cancelling mid-deploy could leave the
# agent partially updated, and cancelling a create could leave an agent whose
# livekit.toml was never committed.
concurrency:
  group: livekit-cloud-agent-deploy
  cancel-in-progress: false

# contents: write is used only by the create path, to commit the generated
# livekit.toml back to the branch the workflow ran on. Deploy only reads.
permissions:
  contents: write

jobs:
  agent:
    name: ${{ inputs.operation }} LiveKit Cloud agent
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Persisted credentials are used to push the generated livekit.toml.
          token: ${{ secrets.GITHUB_TOKEN }}
          # Full history makes the rebase-before-push in the create path work.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      # Deployment identity is explicit. Deploy never creates; create never
      # runs when an identity already exists. This is the guard that prevents
      # silently registering a second production agent.
      - name: Preflight agent identity
        env:
          OPERATION: ${{ inputs.operation }}
          CONFIRM_CREATE: ${{ inputs.confirm_create }}
          REGION: ${{ inputs.region }}
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF}" != "refs/heads/${GITHUB_REF_NAME}" ]; then
            echo "::error::Run this workflow from a branch (not a tag), so a generated livekit.toml can be committed back."
            exit 1
          fi
          if [ -z "${LIVEKIT_URL:-}" ]; then
            echo "::error::LIVEKIT_URL is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          # wss://<project>.livekit.cloud -> <project>
          project_subdomain="${LIVEKIT_URL#*://}"
          project_subdomain="${project_subdomain%%.*}"
          if [ -z "$project_subdomain" ]; then
            echo "::error::Could not derive the LiveKit project subdomain from LIVEKIT_URL."
            exit 1
          fi
          echo "PROJECT_SUBDOMAIN=$project_subdomain" >> "$GITHUB_ENV"

          case "$OPERATION" in
            deploy)
              if [ ! -f livekit.toml ]; then
                echo "::error::livekit.toml is missing, so there is no existing agent to deploy. This repository does not fall back to create: run the workflow with operation=create and confirm_create=true ONCE, then commit the generated livekit.toml."
                exit 1
              fi

              config_subdomain="$(sed -n 's/^[[:space:]]*subdomain[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' livekit.toml | head -n 1)"
              agent_id="$(sed -n 's/^[[:space:]]*id[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' livekit.toml | head -n 1)"

              if [ -z "$config_subdomain" ]; then
                echo "::error::livekit.toml has no [project] subdomain. Refusing to deploy."
                exit 1
              fi
              if [ "$config_subdomain" != "$project_subdomain" ]; then
                echo "::error::livekit.toml belongs to project '$config_subdomain' but LIVEKIT_URL is '$project_subdomain'. Refusing to deploy to the wrong project."
                exit 1
              fi
              if [ -z "$agent_id" ]; then
                echo "::error::livekit.toml has no [agent] id. Refusing to deploy, because a missing id could create a new agent."
                exit 1
              fi
              case "$agent_id" in
                CA_*) : ;;
                *)
                  echo "::error::livekit.toml agent id does not look like a LiveKit Cloud agent id (expected CA_...). Refusing to deploy."
                  exit 1
                  ;;
              esac
              if grep -qiE 'api[_-]?key|api[_-]?secret|token' livekit.toml; then
                echo "::error::livekit.toml appears to contain credential material. Refusing to deploy."
                exit 1
              fi

              echo "Target project subdomain: $project_subdomain"
              echo "Target agent id: $agent_id"
              echo "AGENT_ID=$agent_id" >> "$GITHUB_ENV"
              ;;
            create)
              if [ "${CONFIRM_CREATE:-false}" != "true" ]; then
                echo "::error::Refusing to create an agent without confirm_create=true. Set the confirmation input only when you intend to register a new agent."
                exit 1
              fi
              if [ -f livekit.toml ]; then
                echo "::error::livekit.toml already exists. Refusing to create a second agent. Use operation=deploy. Delete livekit.toml only after confirming the agent it names was actually deleted."
                exit 1
              fi

              # The create action writes the new CA_... id after it registers.
              echo "AGENT_ID=" >> "$GITHUB_ENV"
              echo "Creating a NEW agent in project $project_subdomain (region: ${REGION:-nearest})."
              ;;
            *)
              echo "::error::Unsupported operation '$OPERATION'. Expected 'create' or 'deploy'."
              exit 1
              ;;
          esac

      # Build the deploy-action SECRET_LIST from individual repository secrets.
      # Only names are printed; every value is masked before use. A legacy
      # SECRET_LIST is migrated and obsolete PHONIC_* entries are dropped.
      - name: Resolve agent configuration
        id: secrets
        env:
          LEGACY_SECRET_LIST: ${{ secrets.SECRET_LIST }}
          DEEPSLATE_VENDOR_ID: ${{ secrets.DEEPSLATE_VENDOR_ID }}
          DEEPSLATE_ORGANIZATION_ID: ${{ secrets.DEEPSLATE_ORGANIZATION_ID }}
          DEEPSLATE_API_KEY: ${{ secrets.DEEPSLATE_API_KEY }}
          DEEPSLATE_MODEL: ${{ secrets.DEEPSLATE_MODEL }}
          DEEPSLATE_HOSTED_VOICE_ID: ${{ secrets.DEEPSLATE_HOSTED_VOICE_ID }}
          DEEPSLATE_VAD_START_MS: ${{ secrets.DEEPSLATE_VAD_START_MS }}
          DEEPSLATE_VAD_STOP_MS: ${{ secrets.DEEPSLATE_VAD_STOP_MS }}
          DEEPSLATE_VAD_CONFIDENCE: ${{ secrets.DEEPSLATE_VAD_CONFIDENCE }}
          DEEPSLATE_VAD_MIN_VOLUME: ${{ secrets.DEEPSLATE_VAD_MIN_VOLUME }}
          DEEPSLATE_VAD_BACKBUFFER_MS: ${{ secrets.DEEPSLATE_VAD_BACKBUFFER_MS }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL_ID: ${{ secrets.ELEVENLABS_MODEL_ID }}
          LIVEKIT_AGENT_NAME: ${{ secrets.LIVEKIT_AGENT_NAME }}
        run: |
          set -euo pipefail

          declare -A values=()
          declare -a order=()

          trim() {
            local value="$1"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "$value"
          }

          add_pair() {
            local key value
            key="$(trim "$1")"
            value="$(trim "$2")"
            [ -n "$key" ] || return 0
            [ -n "$value" ] || return 0
            case "$key" in
              PHONIC_*)
                echo "::notice::Dropping obsolete $key from the legacy SECRET_LIST."
                return 0
                ;;
            esac
            if [ -z "${values[$key]+set}" ]; then
              order+=("$key")
            fi
            values["$key"]="$value"
            echo "::add-mask::$value"
          }

          # 1. Migrate a legacy KEY=VALUE list, if one still exists.
          IFS=',' read -r -a pairs <<< "${LEGACY_SECRET_LIST:-}"
          for pair in "${pairs[@]}"; do
            [ -n "$pair" ] || continue
            add_pair "${pair%%=*}" "${pair#*=}"
          done

          # 2. Individual repository secrets override migrated entries.
          add_pair DEEPSLATE_VENDOR_ID "${DEEPSLATE_VENDOR_ID:-}"
          add_pair DEEPSLATE_ORGANIZATION_ID "${DEEPSLATE_ORGANIZATION_ID:-}"
          add_pair DEEPSLATE_API_KEY "${DEEPSLATE_API_KEY:-}"
          add_pair DEEPSLATE_MODEL "${DEEPSLATE_MODEL:-}"
          add_pair DEEPSLATE_HOSTED_VOICE_ID "${DEEPSLATE_HOSTED_VOICE_ID:-}"
          add_pair DEEPSLATE_VAD_START_MS "${DEEPSLATE_VAD_START_MS:-}"
          add_pair DEEPSLATE_VAD_STOP_MS "${DEEPSLATE_VAD_STOP_MS:-}"
          add_pair DEEPSLATE_VAD_CONFIDENCE "${DEEPSLATE_VAD_CONFIDENCE:-}"
          add_pair DEEPSLATE_VAD_MIN_VOLUME "${DEEPSLATE_VAD_MIN_VOLUME:-}"
          add_pair DEEPSLATE_VAD_BACKBUFFER_MS "${DEEPSLATE_VAD_BACKBUFFER_MS:-}"
          add_pair ELEVENLABS_API_KEY "${ELEVENLABS_API_KEY:-}"
          add_pair ELEVENLABS_VOICE_ID "${ELEVENLABS_VOICE_ID:-}"
          add_pair ELEVENLABS_MODEL_ID "${ELEVENLABS_MODEL_ID:-}"
          add_pair LIVEKIT_AGENT_NAME "${LIVEKIT_AGENT_NAME:-}"

          # 3. Fail by variable NAME only when configuration is incomplete.
          missing=()
          for key in DEEPSLATE_VENDOR_ID DEEPSLATE_ORGANIZATION_ID DEEPSLATE_API_KEY; do
            if [ -z "${values[$key]:-}" ]; then
              missing+=("$key")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required Deepslate configuration: ${missing[*]}. Add each as a repository secret under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          hosted="${values[DEEPSLATE_HOSTED_VOICE_ID]:-}"
          eleven_key="${values[ELEVENLABS_API_KEY]:-}"
          eleven_voice="${values[ELEVENLABS_VOICE_ID]:-}"
          if [ -z "$hosted" ] && { [ -z "$eleven_key" ] || [ -z "$eleven_voice" ]; }; then
            echo "::error::No audio output configured. Set both ELEVENLABS_API_KEY and ELEVENLABS_VOICE_ID (the supported free-tier option). DEEPSLATE_HOSTED_VOICE_ID is optional and is not required."
            exit 1
          fi
          if [ -n "$hosted" ] && { [ -n "$eleven_key" ] || [ -n "$eleven_voice" ]; }; then
            echo "::notice::Both TTS backends are configured; the plugin prefers DEEPSLATE_HOSTED_VOICE_ID."
          fi

          echo "Agent secret names supplied: ${order[*]}"

          secret_list=""
          for key in "${order[@]}"; do
            if [ -z "$secret_list" ]; then
              secret_list="$key=${values[$key]}"
            else
              secret_list="$secret_list,$key=${values[$key]}"
            fi
          done

          {
            echo "SECRET_LIST=$secret_list"
            echo "AGENT_NAME=${values[LIVEKIT_AGENT_NAME]:-}"
          } >> "$GITHUB_OUTPUT"

          # Expose the provider configuration to `npm run check:env` only.
          for key in "${!values[@]}"; do
            case "$key" in
              DEEPSLATE_*|ELEVENLABS_*)
                echo "$key=${values[$key]}" >> "$GITHUB_ENV"
                ;;
            esac
          done

      - name: Validate runtime configuration
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${LIVEKIT_URL:-}" ] || missing+=("LIVEKIT_URL")
          [ -n "${LIVEKIT_API_KEY:-}" ] || missing+=("LIVEKIT_API_KEY")
          [ -n "${LIVEKIT_API_SECRET:-}" ] || missing+=("LIVEKIT_API_SECRET")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required LiveKit deployment credential(s): ${missing[*]}."
            exit 1
          fi
          npm run check:env

      # OPERATION "create" registers a new LiveKit Cloud agent and deploys it.
      # The official action writes livekit.toml into WORKING_DIRECTORY. It exits
      # without creating anything if livekit.toml already exists, which the
      # preflight above has already ruled out.
      - name: Create new LiveKit Cloud agent
        id: create
        if: ${{ inputs.operation == 'create' }}
        uses: livekit/deploy-action@v2.12.2
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          SECRET_LIST: ${{ steps.secrets.outputs.SECRET_LIST }}
        with:
          OPERATION: create
          WORKING_DIRECTORY: "."
          REGION: ${{ inputs.region }}

      - name: Verify generated livekit.toml
        if: ${{ inputs.operation == 'create' }}
        run: |
          set -euo pipefail
          if [ ! -f livekit.toml ]; then
            echo "::error::The create operation did not produce livekit.toml. The agent may exist but cannot be deployed safely; download the run log and check LiveKit Cloud before retrying."
            exit 1
          fi

          config_subdomain="$(sed -n 's/^[[:space:]]*subdomain[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' livekit.toml | head -n 1)"
          agent_id="$(sed -n 's/^[[:space:]]*id[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' livekit.toml | head -n 1)"

          if [ -z "$agent_id" ]; then
            echo "::error::livekit.toml was generated without an [agent] id. Refusing to continue because later runs could create another agent."
            exit 1
          fi
          case "$agent_id" in
            CA_*) : ;;
            *)
              echo "::error::Generated agent id does not look like a LiveKit Cloud agent id (expected CA_...)."
              exit 1
              ;;
          esac
          if [ "$config_subdomain" != "${PROJECT_SUBDOMAIN}" ]; then
            echo "::error::Generated livekit.toml targets '$config_subdomain' but LIVEKIT_URL is '${PROJECT_SUBDOMAIN}'."
            exit 1
          fi

          echo "AGENT_ID=$agent_id" >> "$GITHUB_ENV"
          echo "Created agent id: $agent_id"

      - name: Upload generated livekit.toml
        if: ${{ always() && inputs.operation == 'create' }}
        uses: actions/upload-artifact@v4
        with:
          name: livekit-agent-config
          path: livekit.toml
          if-no-files-found: warn

      # Persist the new identity so the next run can deploy instead of create.
      # If the branch is protected and this push is rejected, the artifact above
      # is the manual recovery path; the run fails loudly rather than letting a
      # later create run register a second agent.
      - name: Commit generated livekit.toml
        if: ${{ inputs.operation == 'create' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add livekit.toml
          if git diff --cached --quiet; then
            echo "livekit.toml is already committed; nothing to push."
            exit 0
          fi
          git commit -m "Add generated LiveKit agent config for ${AGENT_ID}"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          if ! git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"; then
            echo "::error::Agent ${AGENT_ID} was created, but livekit.toml could not be pushed to '${GITHUB_REF_NAME}'. Download the 'livekit-agent-config' artifact and commit it before running create again. Do NOT re-run create, or a second agent will be registered."
            exit 1
          fi
          echo "Committed livekit.toml for ${AGENT_ID} to ${GITHUB_REF_NAME}."

      # OPERATION "deploy" ships a new version of the agent named in the
      # committed livekit.toml. It is never used by the create path, and the
      # create operation above is never used here.
      - name: Deploy new version of the existing agent
        id: deploy
        if: ${{ inputs.operation == 'deploy' }}
        uses: livekit/deploy-action@v2.12.2
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          SECRET_LIST: ${{ steps.secrets.outputs.SECRET_LIST }}
        with:
          OPERATION: deploy
          WORKING_DIRECTORY: "."
          REGION: ${{ inputs.region }}

      - name: Wait for the agent to become healthy
        id: status
        if: ${{ success() }}
        uses: livekit/deploy-action@v2.12.2
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        with:
          OPERATION: status-retry
          WORKING_DIRECTORY: "."
          TIMEOUT: 10m

      - name: Install LiveKit CLI
        id: cli
        if: ${{ success() }}
        run: |
          set -euo pipefail
          curl -sSL https://get.livekit.io/cli | bash
          export PATH="$HOME/.local/bin:$PATH"
          lk version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show deployed agent status and version
        if: ${{ success() }}
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          AGENT_ID: ${{ env.AGENT_ID }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          if [ -z "${AGENT_ID:-}" ]; then
            echo "::error::No agent id resolved; refusing to report status for an unknown agent."
            exit 1
          fi
          lk agent status --id "$AGENT_ID" | tee diagnostics/agent-status.txt

      # Proves the deployed worker accepts a job and joins a real LiveKit room.
      # It does not publish microphone audio; the manual console test covers
      # speech, barge-in and recovery. SMOKE_EXPECT_AGENT_NAME makes the client
      # reject a different agent participant when an explicit name is set.
      - name: Room connection smoke test
        id: smoke
        if: ${{ success() && inputs.room_smoke_test }}
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          LIVEKIT_AGENT_NAME: ${{ steps.secrets.outputs.AGENT_NAME }}
          SMOKE_EXPECT_AGENT_NAME: ${{ steps.secrets.outputs.AGENT_NAME }}
        run: |
          set -euo pipefail
          room="agent-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          args=(
            --join
            --room "$room"
            --identity ci-smoke
            --valid-for 10m
            --grant '{"canPublish":false,"canSubscribe":false}'
            --token-only
          )
          if [ -n "${LIVEKIT_AGENT_NAME:-}" ]; then
            args+=(--agent "$LIVEKIT_AGENT_NAME")
            echo "Dispatching the configured agent explicitly."
          else
            echo "Using automatic dispatch (no LIVEKIT_AGENT_NAME configured)."
          fi
          token="$(lk token create "${args[@]}")"
          echo "::add-mask::$token"
          LIVEKIT_TOKEN="$token" LIVEKIT_ROOM="$room" node scripts/room-smoke.ts

      # `lk agent logs` streams, so each call is bounded by `timeout`. Logs are
      # collected on success too: startup and session messages are the evidence
      # that the deployed provider configuration was actually loaded.
      - name: Collect deployment logs
        id: logs
        if: ${{ always() && steps.cli.outcome == 'success' }}
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          AGENT_ID: ${{ env.AGENT_ID }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          if [ -z "${AGENT_ID:-}" ]; then
            echo "No agent id resolved; skipping log collection."
            exit 0
          fi
          timeout 30s lk agent logs --id "$AGENT_ID" --log-type deploy 2>&1 | tee diagnostics/agent-deploy.log || true
          timeout 30s lk agent logs --id "$AGENT_ID" --log-type build 2>&1 | tee diagnostics/agent-build.log || true

          # A deterministic configuration failure must fail the run even if the
          # agent container stayed up. Only variable names appear in these errors.
          if grep -aqE 'Missing required environment variable|No audio output configured for Opal' diagnostics/agent-deploy.log; then
            echo "::error::Agent logs report a configuration failure. See the deployment diagnostics artifact."
            exit 1
          fi
          if grep -aqE 'session error|job failed' diagnostics/agent-deploy.log; then
            echo "::warning::Agent logs contain session errors or failed jobs. Review the diagnostics artifact."
          fi

      - name: Upload deployment diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: livekit-deployment-diagnostics
          path: diagnostics/
          if-no-files-found: ignore

      - name: Report result
        if: ${{ always() }}
        env:
          OPERATION: ${{ inputs.operation }}
          CREATE_OUTCOME: ${{ steps.create.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          STATUS_OUTCOME: ${{ steps.status.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          LOGS_OUTCOME: ${{ steps.logs.outcome }}
          AGENT_ID: ${{ env.AGENT_ID }}
          PROJECT_SUBDOMAIN: ${{ env.PROJECT_SUBDOMAIN }}
          COMMIT: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          REGION: ${{ inputs.region }}
        run: |
          set -euo pipefail
          report="## LiveKit Cloud agent: ${OPERATION}

          | Item | Result |
          | --- | --- |
          | Operation | \`$OPERATION\` |
          | Project subdomain | \`$PROJECT_SUBDOMAIN\` |
          | Agent id | \`${AGENT_ID:-(none)}\` |
          | Create outcome | \`${CREATE_OUTCOME:-skipped}\` |
          | Deploy outcome | \`${DEPLOY_OUTCOME:-skipped}\` |
          | Health/status outcome | \`${STATUS_OUTCOME:-skipped}\` |
          | Room smoke test | \`${SMOKE_OUTCOME:-skipped}\` |
          | Log collection | \`${LOGS_OUTCOME:-skipped}\` |
          | Branch | \`$BRANCH\` |
          | Commit | \`$COMMIT\` |
          | Region | \`$REGION\` |
          "
          if [ "$OPERATION" = "create" ]; then
            report="$report
          livekit.toml for \`$AGENT_ID\` is committed to this branch (or available as the livekit-agent-config artifact). Later runs must use operation=deploy; do not run create again.
          "
          fi
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            printf '%s\n' "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' "$report"
          fi
          if [ "$OPERATION" = "create" ] && [ "$CREATE_OUTCOME" != "success" ]; then
            echo "::error::The LiveKit create operation did not succeed."
            exit 1
          fi
          if [ "$OPERATION" = "deploy" ] && [ "$DEPLOY_OUTCOME" != "success" ]; then
            echo "::error::The LiveKit deploy operation did not succeed."
            exit 1
          fi
          if [ "$STATUS_OUTCOME" != "success" ]; then
            echo "::error::The deployed agent did not become healthy before the timeout."
            exit 1
          fi
          if [ "$SMOKE_OUTCOME" = "failure" ]; then
            echo "::error::The deployed agent did not join a real LiveKit room in the smoke test."
            exit 1
          fi
          echo "Agent $AGENT_ID is created/deployed and healthy."
